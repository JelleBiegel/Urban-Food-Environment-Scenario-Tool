services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ..:/workspaces/Urban-Food-Environment-Scenario-Tool:cached
    command: sleep infinity
    depends_on:
      - gama
    environment:
      GAMA_URI: ws://gama:6868
      GAMA_MODEL_PATH: /workspaces/Urban-Food-Environment-Scenario-Tool/models/Food_outlets_on_Strandeiland.gaml
      GAMA_OUTPUT_PATH: /workspaces/Urban-Food-Environment-Scenario-Tool/Results/web_result.csv

  gama:
    image: gamaplatform/gama:2025.06.4
    volumes:
      - ..:/workspaces/Urban-Food-Environment-Scenario-Tool:cached
    command:
      - "-socket"
      - "6868"
